<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <title>Eco Harmony Project</title>
    <link rel="icon" type="image/svg+xml" href="./icons/favicon/cannabis_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
</head>
<body class="flex items-center justify-center bg-[#59B184]">
    <div class="w-full max-w-360 min-h-screen mx-auto my-32.5 bg-white">
        <header class="flex justify-between items-center py-6 px-15">
            <p class="text-2xl text-[#078A48] font-satoshi tracking-[-0.4%]">Eco Harmony</p>
            <div class="flex">
                <nav class="flex mr-10.5 items-center">
                    <ul class="flex gap-10">
                        <li>
                            <a href="#" class="text-xl text-[#202020] font-satoshi tracking-[-0.4%] hover:text-[#078A48] transition-colors duration-300 ease-out">Home</a>
                        </li>
                        <li>
                            <a href="#" class="text-xl text-[#202020] font-satoshi  tracking-[-0.4%] hover:text-[#078A48] transition-colors duration-300 ease-out">Shop</a>
                        </li>
                        <li>
                            <a href="#" class="text-xl text-[#202020] font-satoshi tracking-[-0.4%] hover:text-[#078A48] transition-colors duration-300 ease-out">Blog</a>
                        </li>
                        <li>
                            <a href="#" class="text-xl text-[#202020] font-satoshi tracking-[-0.4%] hover:text-[#078A48] transition-colors duration-300 ease-out">About Us</a>
                        </li>
                    </ul>
                </nav>
                <a href="#" class="text-xl font-satoshi text-[#202020] py-2.75 px-7.5 border-[0.5px] border-[#2E2E2E] rounded-lg hover:text-[#078A48] hover:border-[#078A48] transition-colors duration-300 ease-out">
                    Get Started
                </a>
            </div>
        </header>
        <main class="mb-18">
            <div class="flex flex-col items-center mx-15 mt-15 mb-25">
                <h1 class="text-5xl font-satoshi text-[#202020] text-center leading-normal tracking-[-0.4%] -mt-1.5">Embark on a Conscious Lifestyle Journey <br> with Eco Harmony</р> 
                <!-- -mt-1.5 поднимает определенный элемент относительно его нормального положения в потоке -->
                <div class="text-2xl font-satoshi text-[#4F4F4F] text-center leading-normal tracking-[-0.4%] mt-6.5">Embark on a journey of discovery - uncover stylish and sustainable products,<br> crafted with care for a greener tomorrow</div>
                <button class="text-xl font-satoshi text-white bg-[#067E42] rounded-lg mt-7.75 px-6.5 py-3 hover:bg-[#046133] hover:text-[#DAD9D9] hover:cursor-pointer focus-visible:outline-[#067E42] focus-visible:outline-3 focus-visible:outline-offset-3 active:bg-[#034E29] active:text-white transition-colors duration-300 ease-out">Explore Eco Harmony</button>
            </div>
            <div class="grid grid-cols-3 gap-5 mt-25 mb-11.25 mx-15">
                <img src="./images/photo-left.png" alt="Светлый интерьер с креслом">
                <div class="flex flex-col gap-4.75">
                    <img src="./images/photo-center-top.png" alt="Корзина с кухонными приборами">
                    <img src="./images/photo-center-bottom.png" alt="Комната с вазой">
                </div>
                <img src="./images/photo-right.png" alt="Вещи висят на лестнице">
            </div>
        </main>
    </div>

</html>

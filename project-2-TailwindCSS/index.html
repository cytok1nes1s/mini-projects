<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/icons/favicon/Vector.svg">
    <link rel="icon" type="image/png" href="/icons/favicon/Vector.png">
    <title>Web Agency</title>
</head>
<body>
    <header>
        <div class="flex justify-between items-center max-w-360 mx-auto px-6.25 py-2.5 shadow-[0_4px_40px_0_rgba(0,0,0,0.1)]">
            <img src="/images/Logo.svg" alt="Logo">
            <nav>
                <ul class="flex h-11.25 w-161.25 justify-between items-center">
                    <li><a href="#" class="text-headings-h6 text-gray-700">About us</a></li>
                    <li><a href="#" class="text-headings-h6 text-gray-700">Services</a></li>
                    <li><a href="#" class="text-headings-h6 text-gray-700">Case Studies</a></li>
                    <li><a href="#" class="text-headings-h6 text-gray-700">Blog</a></li>
                    <li><a href="#" class="text-headings-h6 text-gray-700">How it Works</a></li>
                    <li><a href="#" class="text-headings-h6 text-gray-700">Hire</a></li>
                </ul>
            </nav>
            <button class="text-btn-lg text-gray-50 bg-(image:--gradient-primary-bg) py-3.5 px-6.25 rounded-[5px]">Contact us</button>
        </div>
    </header>
    <main class="max-w-360 mx-auto">
        <section id="hero" class="mx-auto max-w-360 h-180.5 pt-17.25 pb-23 pl-26 pr-14.25">
            <div class="bg-amber-700 grid grid-cols-[531px_748px]">
                    <div class="flex bg-amber-800">
                        <div class="bg-amber-400 py-[103px]">
                            <div>
                                <h1 class="text-lite-h1 text-gray-900 tracking-wide">Great <span class="bg-(image:--gradient-primary-bg) bg-clip-text text-transparent">software</span> is <br> 
                    <span class="text-display-h1-bold text-gray-900">built by great <span class="bg-(image:--gradient-primary-bg) bg-clip-text text-transparent">teams</span></span></h1>
                                <p class="mt-7">We help build and manage a team of world-class developers to bring your vision to life</p>
                            </div>
                            <button class="mr-auto mt-18.75">Let's get started!</button>
                        </div>
                    </div>
                    <img class="w-187 h-140.25" src="/images/Hero-Wrapper__image.svg" alt="Hero wrapper">
            </div>
        </section>
    </main>
    <footer>
        . . .
    </footer>
</body>
</html>
